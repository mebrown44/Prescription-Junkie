<body>
  <arcgis-map basemap="arcgis/navigation" center="-79.9959, 40.4406" zoom="13" id="map">
    <arcgis-zoom slot="top-left"></arcgis-zoom>
    <arcgis-locate slot="top-left"></arcgis-locate>
  </arcgis-map>

  <script type="module">
    import Graphic from "https://js.arcgis.com/5.1/@arcgis/core/Graphic.js";
    import CSVLayer from "https://js.arcgis.com/5.1/@arcgis/core/layers/CSVLayer.js";

    const mapEl = document.getElementById("map");

    mapEl.addEventListener("arcgisViewReadyChange", () => {
      const pharmacyLayer = new CSVLayer({
        url: "./pharmacies.csv",
        latitudeField: "YCOORD",   // match your actual column name
        longitudeField: "XCOORD",  // match your actual column name
        popupTemplate: {
          title: "{NAME}",
          content: "{ADDRESS}, {CITY}, {STATE} {ZIPCODE}"
        }
      });
      mapEl.map.add(pharmacyLayer);
    });
  </script>
